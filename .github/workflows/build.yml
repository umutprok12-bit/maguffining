name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ForgeGradle 2.3 only works on Java 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # setupCIWorkspace is the lighter ForgeGradle 2.3 setup meant for CI (no decompile)
      - name: Build
        run: ./gradlew setupCIWorkspace build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: redguns-jar
          path: build/libs/*.jar
          if-no-files-found: error
